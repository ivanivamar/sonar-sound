<main class="app-shell" [class.signed-in]="authService.isSignedIn()">
    @if (authService.isSignedIn()) {
        <app-sidebar></app-sidebar>
        <section class="shell-panel">
            <app-atmosphere></app-atmosphere>
            <div class="app-content" cdkVirtualScrollingElement>
                <app-topbar></app-topbar>
                <router-outlet />
            </div>
        </section>
    } @else {
        <app-atmosphere></app-atmosphere>
        <router-outlet />
    }
</main>
