<main class="app-shell" [class.signed-in]="authService.isSignedIn()">
    @if (authService.isSignedIn()) {
        <app-sidebar></app-sidebar>
        <section class="shell-panel">
            <app-atmosphere></app-atmosphere>
            <div class="app-content">
                <div class="navigation-status" role="status">
                    @if (currentNavigation()) {
                        <span>Loading page...</span>
                    }
                </div>
                <app-topbar [scrolled]="pageScrolled()"></app-topbar>
                <div
                    #pageContent
                    class="page-content"
                    cdkVirtualScrollingElement
                    (scroll)="updatePageScroll(pageContent.scrollTop)"
                >
                    <router-outlet (activate)="updatePageScroll(pageContent.scrollTop)" />
                </div>
                <app-player></app-player>
            </div>
        </section>
    } @else {
        <app-atmosphere></app-atmosphere>
        <router-outlet />
    }
</main>
