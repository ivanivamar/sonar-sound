@if (libraryService.isLoading()) {
    <span>Loading...</span>
} @else {
    <ng-template appTopbarLeft>
        <div class="vertical">
            <h1 class="topbar-title">Library</h1>
        </div>
    </ng-template>

    <div class="library-container">
        <div class="sticky-tabs">
            <app-tabs
                [tabs]="tabs()"
                [currentTab]="currentTab()"
                (currentTabChange)="selectTab($event)"
            ></app-tabs>
        </div>

        @switch (currentTab()) {
            @case ('all') {}
            @case ('albums') {
                <app-albums
                    [albums]="libraryService.albums()"
                    (albumClick)="goToAlbum($event)"
                ></app-albums>
            }

            @case ('artists') {
                <app-artists
                    [artists]="libraryService.artists()"
                    (artistClick)="goToArtist($event)"
                ></app-artists>
            }
            @case ('tracks') {
                <app-tracks [tracks]="libraryService.trackRows()"></app-tracks>
            }
        }
    </div>
}
