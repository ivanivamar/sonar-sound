<aside class="sidebar">
    <a href="/" class="sidebar-header" (click)="linkActivated.emit()">
        <img class="sidebar-logo" src="/pelagic-logo.svg" alt="Pelagic" />
        <div class="header-content">
            <span class="header-title">Pelagic</span>
            <span class="header-subtitle">Google Drive</span>
        </div>
    </a>

    <nav class="sidebar-nav" aria-label="Main navigation">
        @for (item of navItems(); track item.label) {
            <a
                [routerLink]="item.href"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                appRipple
                class="nav-item"
                (click)="linkActivated.emit()"
            >
                <i class="material-symbols-rounded nav-item__icon" aria-hidden="true">{{
                    item.icon
                }}</i>
                <span class="nav-item__label">{{ item.label }}</span>
            </a>
        }
    </nav>

    <div class="sidebar-footer">
        <div class="account-menu" appClickOutside (clickOutside)="closeAccountPopup()">
            <button
                #accountButton
                class="account-button"
                (click)="toggleAccountPopup()"
                [attr.aria-expanded]="isAccountPopupVisible()"
                aria-haspopup="true"
                aria-label="Account menu"
            >
                @if (userService.userInfo.value(); as user) {
                    <div class="account-content">
                        <img
                            class="account-content__avatar"
                            referrerpolicy="no-referrer"
                            [src]="user.picture"
                            alt="{{ user.given_name }}"
                        />
                        <div class="account-data">
                            <span class="account-name">{{ user.given_name }}</span>
                        </div>
                    </div>
                }
                <i class="material-symbols-rounded account-chevron" aria-hidden="true"
                    >unfold_more</i
                >
            </button>
            <app-account-popup
                [isVisible]="isAccountPopupVisible()"
                [anchor]="accountButton"
                [userInfo]="userService.userInfo.value()"
            ></app-account-popup>
        </div>
    </div>
</aside>
