<div class="album-card" (click)="goToAlbum()" (keypress)="goToAlbum()" tabindex="0">
    <div
        class="cover-wrapper test"
        [style.--glow-color]="
            coverColor.hasValue()
                ? 'oklch(65% ' +
                  coverColor.value().chroma * 0.18 +
                  ' ' +
                  coverColor.value().hue +
                  ' / 0.65)'
                : 'transparent'
        "
    >
        @defer (on viewport) {
            <app-cover [cover]="album().cover"></app-cover>
        } @placeholder {
            <app-cover-placeholder></app-cover-placeholder>
        }
    </div>

    <div class="album-info">
        <span class="album-title" [title]="album().title">{{ album().title }}</span>
        <div class="album-meta">
            <span class="album-artist">{{ album().artist }}</span>
            ·
            <span class="album-year">{{ album().year }}</span>
        </div>
    </div>
</div>
