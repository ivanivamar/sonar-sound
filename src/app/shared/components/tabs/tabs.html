<div class="tabs-wrapper">
    @for (tab of tabs(); track tab.id) {
        <button
            class="tab"
            [class.active]="tab.id === currentTab()"
            appRipple
            (click)="onTabClick(tab)"
        >
            @if (tab.icon) {
                <i class="material-symbols-rounded">{{ tab.icon }}</i>
            }
            <span>{{ tab.title }}</span>
            @if (tab.hint) {
                <span class="hint">{{ tab.hint }}</span>
            }
        </button>
    }
</div>
