<div class="album-card" (click)="goToAlbum()" (keypress)="goToAlbum()" tabindex="0">
    <div class="cover-wrapper" [style.--glow-color]="glow()">
        @defer (on viewport) {
            <app-cover
                [cover]="album().cover"
                [extractColor]="needsExtraction()"
                (colorResolved)="extractedColor.set($event)"
            ></app-cover>
        } @placeholder {
            <app-cover-placeholder></app-cover-placeholder>
        }
    </div>

    <div class="album-info">
        <span class="album-title" [title]="album().title">{{ album().title }}</span>
        <div class="album-meta">
            <a class="album-artist" href="/library/artist/{{ album().artistId }}">{{
                album().artist
            }}</a>
            ·
            <span class="album-year">{{ album().year }}</span>
        </div>
    </div>
</div>
