<button
    class="button-icon btn-text control-secondary"
    [class.shuffle-active]="shuffleActive()"
    [disabled]="!playerService.currentTrack()"
    [attr.aria-label]="shuffleLabel()"
    [attr.aria-pressed]="shuffleActive()"
    (click)="toggleShuffle($event)"
>
    <i class="material-symbols-rounded" aria-hidden="true">shuffle</i>
</button>
<button
    class="button-icon btn-text control-secondary"
    [disabled]="!playerService.currentTrack()"
    aria-label="Previous track"
    (click)="previous($event)"
>
    <i class="material-symbols-rounded" aria-hidden="true">skip_previous</i>
</button>
<button
    class="button-icon btn-filled btn-circle control-play"
    appRipple
    [disabled]="!playerService.currentTrack()"
    [attr.aria-label]="playerService.isPlaying() ? 'Pause' : 'Play'"
    [attr.aria-busy]="playerService.isBuffering()"
    (click)="toggle($event)"
>
    <i
        class="material-symbols-rounded"
        aria-hidden="true"
        [class.loading]="playerService.isBuffering()"
    >
        {{ playIcon() }}
    </i>
</button>
<button
    class="button-icon btn-text control-secondary"
    [disabled]="!playerService.currentTrack()"
    aria-label="Next track"
    (click)="next($event)"
>
    <i class="material-symbols-rounded" aria-hidden="true">skip_next</i>
</button>
<button
    class="button-icon btn-text control-secondary"
    [class.repeat-active]="repeatActive()"
    [disabled]="!playerService.currentTrack()"
    [attr.aria-label]="repeatLabel()"
    [attr.aria-pressed]="repeatActive()"
    (click)="toggleRepeat($event)"
>
    <i class="material-symbols-rounded" aria-hidden="true">{{ repeatIcon() }}</i>
</button>
@if (controlError(); as error) {
    <span role="alert">{{ error }}</span>
}
