<footer
    class="player"
    (click)="onFooterClick($event)"
    (keydown)="onFooterKeydown($event)"
    tabindex="0"
>
    <div class="player-slider-wrapper">
        <app-slider
            [value]="position()"
            [max]="duration()"
            (valueChange)="seek($event)"
        ></app-slider>
    </div>

    <div class="player-track">
        @if (!currentTrack()) {
            <span class="track-title"> No track playing </span>
        } @else {
            <div
                class="track-cover"
                [style.--glow-color]="
                    coverColor()
                        ? 'oklch(65% ' +
                          coverColor()!.chroma * 0.18 +
                          ' ' +
                          coverColor()?.hue +
                          ' / 0.65)'
                        : 'transparent'
                "
            >
                <app-cover [cover]="cover()"></app-cover>
            </div>

            <div class="track-data">
                <span class="track-title">
                    {{ currentTrack()?.title }}
                </span>
                @if (error()) {
                    <span class="track-error" role="alert">{{ error() }} Press play to retry.</span>
                } @else {
                    <div class="track-artist-album">
                        <span class="track-artist">
                            {{ currentTrack()?.artist }}
                        </span>
                        ·
                        <a
                            [routerLink]="['/library/album/', currentTrack()?.albumId]"
                            class="track-album"
                            (click)="closeNowPlaying()"
                        >
                            {{ currentTrack()?.albumTitle }}
                        </a>
                    </div>
                }
            </div>
        }
    </div>

    <app-playback-controls class="player-controls"></app-playback-controls>

    <div class="player-actions">
        <span class="track-duration">
            {{ position() | duration }} / {{ duration() | duration }}
        </span>
        <button
            class="button-icon btn-text control-secondary"
            [disabled]="!currentTrack()"
            aria-label="Now Playing"
            (click)="nowPlaying.toggle()"
        >
            <i class="material-symbols-rounded" aria-hidden="true">
                {{ nowPlaying.isOpen() ? 'expand_more' : 'expand_less' }}
            </i>
        </button>
    </div>
</footer>

<app-now-playing #nowPlaying></app-now-playing>
