<footer class="player">
    <div class="player-slider-wrapper">
        <app-slider
            [value]="position()"
            [max]="duration()"
            (valueChange)="seek($event)"
        ></app-slider>
    </div>

    <div class="player-track">
        @if (!currentTrack()) {
            <span class="track-title"> No track playing </span>
        } @else {
            <div
                class="track-cover"
                [style.--glow-color]="
                    coverColor()
                        ? 'oklch(65% ' +
                          coverColor()!.chroma * 0.18 +
                          ' ' +
                          coverColor()?.hue +
                          ' / 0.65)'
                        : 'transparent'
                "
            >
                <app-cover [cover]="cover()"></app-cover>
            </div>

            <div class="track-data">
                <span class="track-title">
                    {{ currentTrack()?.title }}
                </span>
                @if (error()) {
                    <span class="track-error" role="alert">{{ error() }} Press play to retry.</span>
                } @else {
                    <div class="track-artist-album">
                        <span class="track-artist">
                            {{ currentTrack()?.artist }}
                        </span>
                        ·
                        <a
                            [routerLink]="['/library/album/', currentTrack()?.albumId]"
                            class="track-album"
                        >
                            {{ currentTrack()?.albumTitle }}
                        </a>
                    </div>
                }
            </div>
        }
    </div>

    <div class="player-controls">
        <button class="button-icon btn-text control-secondary" disabled aria-label="Shuffle">
            <i class="material-symbols-rounded" aria-hidden="true">shuffle</i>
        </button>
        <button class="button-icon btn-text control-secondary" disabled aria-label="Previous track">
            <i class="material-symbols-rounded" aria-hidden="true">skip_previous</i>
        </button>
        <button
            class="button-icon btn-filled btn-circle"
            appRipple
            [disabled]="!currentTrack()"
            [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'"
            [attr.aria-busy]="isBuffering()"
            (click)="toggleTrack()"
        >
            <i
                class="material-symbols-rounded"
                aria-hidden="true"
                [class.loading]="isBuffering()"
            >
                {{ isBuffering() ? 'autorenew' : isPlaying() ? 'pause' : 'play_arrow' }}
            </i>
        </button>
        <button class="button-icon btn-text control-secondary" disabled aria-label="Next track">
            <i class="material-symbols-rounded" aria-hidden="true">skip_next</i>
        </button>
        <button class="button-icon btn-text control-secondary" disabled aria-label="Repeat">
            <i class="material-symbols-rounded" aria-hidden="true">repeat</i>
        </button>
    </div>

    <div class="player-actions">
        <span class="track-duration">
            {{ position() | duration }} / {{ duration() | duration }}
        </span>
    </div>
</footer>
