<div
    class="track-card"
    appRipple
    [class.current-playing]="isCurrentPlaying()"
    role="group"
    tabindex="0"
    [attr.aria-label]="track().title"
    aria-description="Press Enter or Space to play or pause"
    (click)="playFromRow($event)"
    (keydown)="playFromKeyboard($event)"
>
    <div class="lead-wrapper">
        <div class="track-number">
            {{ track()?.track }}
        </div>

        <button
            class="play-button button-icon btn-text btn-circle"
            appRipple
            [attr.aria-label]="playLabel()"
            [attr.aria-busy]="isCurrentBuffering()"
            (click)="play($event)"
        >
            <i
                class="material-symbols-rounded"
                aria-hidden="true"
                [class.loading]="isCurrentBuffering()"
            >
                {{ icon() }}
            </i>
        </button>
    </div>
    <div class="track-info">
        <ng-content select="[cover]"> </ng-content>
        <div class="track-text">
            <span class="track-title">{{ track()?.title }}</span>
            @if (showArtist()) {
                <a [routerLink]="['/library/artist/', track()?.artistId]" class="track-artist">{{
                    track()?.artist
                }}</a>
            }
        </div>
    </div>
    @if (showAlbum()) {
        <a [routerLink]="['/library/album/', track()?.albumId]" class="track-album">{{
            track()?.albumTitle
        }}</a>
    }
    <span class="track-duration">{{ track()?.duration | duration }}</span>
</div>
