<div class="search-wrapper" [class.search-sm]="isSmall()">
    <i class="material-symbols-rounded">search</i>
    <input
        class="search-bar"
        type="search"
        aria-label="Search albums"
        [value]="value()"
        (input)="onInput($any($event.target).value)"
        [placeholder]="placeholder()"
    />
</div>
